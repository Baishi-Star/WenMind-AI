# WenMind AI 前端静态托管 + /api 反向代理
# 安装位置: /etc/nginx/conf.d/wenmind.conf
server {
    listen 80;
    server_name _;

    # 前端 dist 由流水线制品解压到 /opt/wenmind/current/frontend
    root /opt/wenmind/current/frontend;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端反向代理: 保留完整 /api 前缀 (后端路由挂在 /api/v1 下)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 评价/视觉识别为长耗时请求 (分钟级), 放宽读超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 60m;
    }
}